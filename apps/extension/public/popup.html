<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Discord Server Leaver</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #090b12;
      --surface: #10131e;
      --surface-2: #171b29;
      --surface-3: #1d2233;
      --line: #282e42;
      --line-bright: #3b4565;
      --text: #f7f8fc;
      --muted: #9aa3b8;
      --brand: #7c6cff;
      --brand-2: #4ea8ff;
      --success: #43d69b;
      --danger: #ff6476;
      --warning: #ffbd61;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; width: 580px; height: 620px; overflow: hidden; }

    body {
      display: flex;
      flex-direction: column;
      color: var(--text);
      background:
        radial-gradient(circle at 6% -8%, rgba(124, 108, 255, .27), transparent 34%),
        radial-gradient(circle at 100% 8%, rgba(78, 168, 255, .13), transparent 30%),
        var(--bg);
    }

    button, input, textarea, select { font: inherit; }

    button {
      min-height: 38px;
      padding: 9px 14px;
      border: 1px solid var(--line-bright);
      border-radius: 10px;
      color: var(--text);
      background: var(--surface-3);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }

    button:hover:not(:disabled) { border-color: #65729c; background: #252b40; transform: translateY(-1px); }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }
    button:disabled { opacity: .42; cursor: not-allowed; }
    button.primary { border-color: transparent; background: linear-gradient(135deg, var(--brand), #6554ed); box-shadow: 0 8px 22px rgba(98, 79, 237, .25); }
    button.primary:hover:not(:disabled) { border-color: transparent; background: linear-gradient(135deg, #8c7dff, #7060f2); }
    button.secondary { background: var(--surface-2); }
    button.success { border-color: rgba(67, 214, 155, .25); background: rgba(67, 214, 155, .14); color: #8ce9c2; }
    button.danger { border-color: rgba(255, 100, 118, .3); background: rgba(255, 100, 118, .13); color: #ff9dab; }
    button.danger:hover:not(:disabled) { border-color: rgba(255, 100, 118, .55); background: rgba(255, 100, 118, .2); }
    button.full { width: 100%; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      padding: 15px 18px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      background: rgba(12, 14, 23, .72);
      backdrop-filter: blur(18px);
    }

    .brand-lockup { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(154, 143, 255, .38);
      border-radius: 13px;
      background: linear-gradient(145deg, rgba(124,108,255,.28), rgba(78,168,255,.12));
      box-shadow: inset 0 1px rgba(255,255,255,.11), 0 10px 28px rgba(65, 51, 168, .2);
      color: #b7aeff;
    }
    .brand-mark svg { width: 23px; height: 23px; }
    .header h1 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .header .subtitle { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .user-info {
      max-width: 176px;
      overflow: hidden;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(23,27,41,.82);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tabs {
      display: flex;
      gap: 5px;
      min-height: 50px;
      padding: 7px 11px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      background: rgba(10,12,19,.86);
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      min-height: 34px;
      padding: 7px 11px;
      flex: 0 0 auto;
      border-color: transparent;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      font-weight: 700;
    }
    .tab:hover:not(:disabled) { border-color: transparent; color: var(--text); background: var(--surface-2); transform: none; }
    .tab.active { color: #fff; border-color: rgba(124,108,255,.25); background: linear-gradient(135deg, rgba(124,108,255,.24), rgba(78,168,255,.1)); }
    .tab[data-tab="donate"] { color: #ff9ebb; }
    .tab[data-tab="donate"].active { border-color: rgba(255,112,156,.27); background: rgba(255,112,156,.12); color: #ffc0d2; }

    .tab-content { flex: 1; min-height: 0; display: none; overflow-y: auto; padding: 18px; }
    .tab-content.active { display: block; }
    .tab-content::-webkit-scrollbar, .server-list::-webkit-scrollbar { width: 7px; }
    .tab-content::-webkit-scrollbar-thumb, .server-list::-webkit-scrollbar-thumb { border-radius: 999px; background: #32394f; }

    .login-screen { max-width: 390px; margin: 0 auto; padding: 46px 20px 26px; text-align: center; }
    .login-screen h2, .login-screen h3 { margin: 0 0 9px; font-size: 21px; letter-spacing: -.025em; }
    .login-screen p { margin: 0 0 22px; color: var(--muted); line-height: 1.55; }

    .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .toolbar input { flex: 1; min-width: 0; }
    .sticky-actions { position: sticky; top: -18px; z-index: 5; padding: 0 0 12px; background: linear-gradient(var(--bg) 78%, transparent); }
    .sticky-actions button { width: 100%; }

    input, textarea, select {
      width: 100%;
      min-height: 40px;
      padding: 10px 12px;
      border: 1px solid var(--line-bright);
      border-radius: 10px;
      color: var(--text);
      background: #0d1019;
      font-size: 13px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input::placeholder, textarea::placeholder { color: #697289; }
    input:focus, textarea:focus, select:focus { border-color: #7063e8; box-shadow: 0 0 0 3px rgba(124,108,255,.12); }
    textarea { min-height: 92px; resize: vertical; }
    input[type="checkbox"] { width: 18px; min-height: 18px; padding: 0; accent-color: var(--brand); }
    input[type="file"] { padding: 7px; }

    .server-list { max-height: 345px; overflow-y: auto; padding: 6px; border: 1px solid var(--line); border-radius: 13px; background: rgba(13,16,25,.74); }
    .server-item { display: flex; align-items: center; gap: 11px; padding: 10px; border-radius: 10px; cursor: pointer; transition: background .15s ease; }
    .server-item:hover { background: var(--surface-2); }
    .server-item[data-owner="true"] { opacity: .46; cursor: not-allowed; }
    .server-icon, .server-icon-placeholder { width: 38px; height: 38px; flex: 0 0 auto; border-radius: 11px; background: linear-gradient(135deg, #7566f5, #479ee8); object-fit: cover; }
    .server-name { flex: 1; min-width: 0; overflow: hidden; color: #e9ebf4; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .owner-badge { padding: 3px 7px; border-radius: 999px; color: #c7c0ff; background: rgba(124,108,255,.15); font-size: 9px; font-weight: 800; letter-spacing: .06em; }

    .notice { margin-top: 16px; padding: 12px 13px; border: 1px solid var(--line); border-radius: 11px; color: var(--muted); background: rgba(23,27,41,.78); font-size: 12px; line-height: 1.5; text-align: left; }
    .notice strong { display: block; margin-bottom: 3px; color: var(--text); }
    .empty { padding: 34px 20px; color: #737d94; text-align: center; }
    .actions { display: flex; flex-direction: column; gap: 8px; }
    .actions button { width: 100%; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 7px; color: #b3bbce; font-size: 12px; font-weight: 650; }
    .form-group > button { width: 100%; }
    .ai-credits { margin-bottom: 16px; padding: 16px; border: 1px solid rgba(124,108,255,.22); border-radius: 14px; background: linear-gradient(135deg, rgba(124,108,255,.22), rgba(78,168,255,.08)); text-align: center; }
    .ai-credits .count { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
    .ai-credits .label { margin-top: 3px; color: #bbc1d3; font-size: 11px; }
    .message-item, .rule-item, .schedule-item { margin-bottom: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
    .message-item .meta, .rule-item .details, .schedule-item .details { margin-bottom: 5px; color: #747e95; font-size: 10px; }
    .message-item .content { color: #dfe3ee; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
    .rule-item, .schedule-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .rule-item .info, .schedule-item .info { flex: 1; }
    .rule-item .title, .schedule-item .title { margin-bottom: 4px; font-weight: 700; }
    .rule-item .actions, .schedule-item .actions { flex-direction: row; }
    .btn-small { min-height: 30px; padding: 5px 9px; font-size: 11px; }
    a { color: #9a91ff; }

    #tab-ai { overflow: hidden; padding: 0; background: #101115; }
    .ai-chat-shell { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; min-height: 0; }
    .ai-chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 10px 16px;
      border-bottom: 1px solid #27292f;
      background: #15161a;
    }
    .ai-chat-identity { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .ai-avatar, .ai-empty-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border: 1px solid #3c414b;
      border-radius: 8px;
      color: #eef0f4;
      background: #25272d;
      font-size: 10px;
      font-weight: 800;
    }
    .ai-chat-identity strong { display: block; color: #f3f3f4; font-size: 13px; }
    .ai-chat-identity span:last-child { display: block; margin-top: 2px; color: #8e929b; font-size: 10px; }
    .icon-button {
      display: grid;
      place-items: center;
      width: 34px;
      min-width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      border-color: transparent;
      border-radius: 8px;
      color: #a7abb4;
      background: transparent;
    }
    .icon-button:hover:not(:disabled) { border-color: #343740; color: #f0f1f3; background: #22242a; transform: none; }
    .icon-button svg, .ai-send-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .ai-chat-history { min-height: 0; overflow-y: auto; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: #34363d transparent; }
    .ai-chat-history::-webkit-scrollbar { width: 7px; }
    .ai-chat-history::-webkit-scrollbar-thumb { border-radius: 999px; background: #34363d; }
    .ai-empty { display: grid; justify-items: center; align-content: center; min-height: 100%; padding: 34px 48px; text-align: center; }
    .ai-empty-mark { width: 42px; height: 42px; margin-bottom: 14px; font-size: 11px; }
    .ai-empty h2 { margin: 0 0 7px; color: #f2f2f3; font-size: 20px; font-weight: 650; letter-spacing: 0; }
    .ai-empty p { max-width: 370px; margin: 0; color: #9699a1; font-size: 12px; line-height: 1.55; }
    .ai-suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: min(100%, 400px); margin-top: 20px; }
    .ai-suggestions button { min-height: 52px; padding: 10px 12px; border-color: #30323a; border-radius: 8px; color: #c5c7cc; background: #18191e; font-size: 11px; font-weight: 550; line-height: 1.35; }
    .ai-suggestions button:hover { border-color: #484b55; background: #1d1f24; transform: none; }
    .ai-message-row { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 11px; padding: 15px 18px; border-bottom: 1px solid rgba(255,255,255,.04); }
    .ai-message-row.user { background: #101115; }
    .ai-message-row.assistant { background: #16171b; }
    .ai-message-row.error { color: #ff9ca8; background: #1c1518; }
    .ai-message-avatar {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid #3a3d45;
      border-radius: 7px;
      color: #d9dbe0;
      background: #24262c;
      font-size: 9px;
      font-weight: 800;
    }
    .ai-message-row.user .ai-message-avatar { color: #dcd8ff; border-color: #4c476a; background: #29263c; }
    .ai-message-body { min-width: 0; padding-top: 1px; }
    .ai-message-author { margin-bottom: 6px; color: #e8e9ec; font-size: 11px; font-weight: 750; display: flex; align-items: center; justify-content: space-between; }
    .ai-message-delete {
      display: none;
      min-width: 20px;
      min-height: 20px;
      width: 20px;
      height: 20px;
      padding: 0;
      border: 1px solid #3a3d45;
      border-radius: 4px;
      background: #1f2028;
      color: #8a8d95;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      transition: all .15s ease;
    }
    .ai-message-row:hover .ai-message-delete { display: block; }
    .ai-message-delete:hover { border-color: #ff6476; background: rgba(255, 100, 118, .15); color: #ff9dab; transform: translateY(0); }
    .ai-message-content { color: #cfd1d6; font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; white-space: pre-wrap; }
    .ai-message-images { display: grid; grid-template-columns: repeat(2, minmax(0, 150px)); gap: 7px; margin: 0 0 8px; }
    .ai-message-images img { display: block; width: 100%; max-height: 150px; border: 1px solid #353841; border-radius: 8px; background: #0b0c0f; object-fit: cover; }
    .ai-thinking { display: flex; align-items: center; gap: 4px; height: 22px; }
    .ai-thinking span { width: 5px; height: 5px; border-radius: 50%; background: #898d96; animation: ai-thinking 1.2s infinite ease-in-out; }
    .ai-thinking span:nth-child(2) { animation-delay: .15s; }
    .ai-thinking span:nth-child(3) { animation-delay: .3s; }
    @keyframes ai-thinking { 0%, 70%, 100% { opacity: .35; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-3px); } }
    .ai-composer-wrap { padding: 10px 14px 8px; border-top: 1px solid #292b31; background: #15161a; transition: background .15s ease, box-shadow .15s ease; }
    .ai-composer-wrap.is-dragging { background: #1d1e25; box-shadow: inset 0 0 0 2px #7065c7; }
    .ai-composer { overflow: hidden; border: 1px solid #393c45; border-radius: 8px; background: #222329; box-shadow: 0 5px 18px rgba(0,0,0,.18); }
    .ai-composer:focus-within { border-color: #5e626e; box-shadow: 0 0 0 2px rgba(124,108,255,.1), 0 5px 18px rgba(0,0,0,.18); }
    .ai-composer textarea { display: block; min-height: 46px; max-height: 120px; padding: 12px 13px 4px; overflow-y: auto; border: 0; border-radius: 0; background: transparent; box-shadow: none; resize: none; line-height: 1.45; }
    .ai-composer textarea:focus { border: 0; box-shadow: none; }
    .ai-composer-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; padding: 4px 7px 7px; }
    .ai-attachment-actions { display: flex; align-items: center; min-width: 0; color: #858993; font-size: 9px; }
    .ai-attachment-actions span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ai-send-button {
      display: grid;
      place-items: center;
      width: 32px;
      min-width: 32px;
      height: 32px;
      min-height: 32px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      color: #15151a;
      background: #f1f1f2;
    }
    .ai-send-button:hover:not(:disabled) { border: 0; color: #15151a; background: #fff; transform: none; }
    .ai-composer-footnote { margin-top: 5px; color: #696d76; font-size: 8px; text-align: center; }
    .ai-image-previews { display: flex; gap: 8px; padding: 0 0 8px; overflow-x: auto; }
    .ai-image-previews[hidden] { display: none; }
    .ai-image-preview { position: relative; width: 58px; height: 58px; flex: 0 0 auto; }
    .ai-image-preview img { width: 100%; height: 100%; border: 1px solid #444751; border-radius: 8px; background: #0c0d10; object-fit: cover; }
    .ai-image-preview button { position: absolute; top: -5px; right: -5px; display: grid; place-items: center; width: 20px; min-width: 20px; height: 20px; min-height: 20px; padding: 0; border: 1px solid #555963; border-radius: 50%; color: #f2f2f3; background: #22242a; font-size: 14px; line-height: 1; }
    .ai-image-preview button:hover { background: #353840; transform: none; }

    .donation-hero {
      position: relative;
      overflow: hidden;
      padding: 22px;
      border: 1px solid rgba(255,123,168,.26);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(255,104,154,.14), rgba(124,108,255,.12) 54%, rgba(78,168,255,.06));
      box-shadow: 0 18px 46px rgba(0,0,0,.22);
    }
    .donation-hero::after { content: ""; position: absolute; top: -70px; right: -55px; width: 170px; height: 170px; border-radius: 50%; background: rgba(255,116,161,.13); filter: blur(2px); }
    .donation-kicker { position: relative; z-index: 1; color: #ff9cbb; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .donation-hero h2 { position: relative; z-index: 1; margin: 6px 0 7px; font-size: 25px; letter-spacing: -.04em; }
    .donation-hero > p { position: relative; z-index: 1; max-width: 430px; margin: 0; color: #b7bfd1; font-size: 13px; line-height: 1.55; }
    .donation-form { position: relative; z-index: 1; margin-top: 20px; padding: 16px; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; background: rgba(8,10,17,.58); backdrop-filter: blur(12px); }
    .amount-wrap { position: relative; }
    .amount-prefix { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #f4f5fb; font-size: 18px; font-weight: 800; }
    .amount-wrap input { height: 48px; padding-left: 31px; font-size: 18px; font-weight: 750; }
    .quick-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin: 10px 0 14px; }
    .quick-amounts button { min-height: 34px; padding: 7px; background: rgba(30,35,51,.9); }
    .quick-amounts button.selected { border-color: #ff789f; color: #ffc1d3; background: rgba(255,112,156,.14); }
    .donation-note { display: flex; align-items: center; gap: 7px; margin-top: 11px; color: #7f899f; font-size: 10px; }
    .donation-note svg { width: 13px; height: 13px; flex: 0 0 auto; color: var(--success); }
    .field-error { min-height: 17px; margin-top: 6px; color: #ff93a1; font-size: 11px; }

    #status {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 12px;
      max-width: calc(100% - 28px);
      min-height: 0;
      padding: 9px 13px;
      border: 1px solid rgba(67,214,155,.25);
      border-radius: 999px;
      color: #9cebc9;
      background: rgba(17,32,29,.96);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      transform: translateX(-50%);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    #status:empty { opacity: 0; transform: translate(-50%, 8px); }
    #status.error { border-color: rgba(255,100,118,.3); color: #ffacb7; background: rgba(51,20,27,.97); }

    .dialog-backdrop { position: fixed; z-index: 100; inset: 0; display: grid; place-items: center; padding: 22px; background: rgba(4,5,10,.76); backdrop-filter: blur(7px); animation: fade-in .16s ease; }
    .dialog-backdrop[hidden] { display: none; }
    .extension-dialog { width: min(100%, 410px); padding: 20px; border: 1px solid var(--line-bright); border-radius: 17px; background: linear-gradient(155deg, #191d2b, #10131d); box-shadow: 0 28px 80px rgba(0,0,0,.58); animation: dialog-in .18s ease; }
    .dialog-icon { display: grid; place-items: center; width: 42px; height: 42px; margin-bottom: 14px; border-radius: 12px; color: var(--warning); background: rgba(255,189,97,.12); font-size: 20px; font-weight: 900; }
    .extension-dialog.danger-mode .dialog-icon { color: #ff94a2; background: rgba(255,100,118,.12); }
    .extension-dialog h2 { margin: 0 0 7px; font-size: 19px; letter-spacing: -.025em; }
    .extension-dialog p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .dialog-field { margin-top: 15px; }
    .dialog-field label { display: block; margin-bottom: 7px; color: #c3c9d8; font-size: 11px; }
    .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 19px; }
    .dialog-actions button { width: 100%; }
    .dialog-confirm.danger { color: #fff; border-color: transparent; background: linear-gradient(135deg, #f05b6d, #d94458); }
    @keyframes fade-in { from { opacity: 0; } }
    @keyframes dialog-in { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand-lockup">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M7 8.5a8.8 8.8 0 0 1 10 0M7 15.5a8.8 8.8 0 0 0 10 0"/>
          <circle cx="9" cy="12" r="1" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="12" r="1" fill="currentColor" stroke="none"/>
          <path d="M5.5 7.5C4.5 10 4 12.8 4.2 16l3-1M18.5 7.5c1 2.5 1.5 5.3 1.3 8.5l-3-1"/>
        </svg>
      </div>
      <div>
        <h1>Discord Server Leaver</h1>
        <div class="subtitle">Manage less. Find more.</div>
